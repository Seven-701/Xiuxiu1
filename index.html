<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>游戏人间</title>
  <style>
    /* ===== 页面整体：深色背景，游戏画布居中 ===== */
    html, body { margin: 0; padding: 0; background: #111; height: 100%; }
    #app { display: flex; justify-content: center; align-items: center; height: 100%; }
    #game-wrap { position: relative; }          /* UI 层以它为基准定位 */
    #game { width: 960px; height: 540px; }

    /* ===== UI 层：盖在游戏画布上面 ===== */
    /* pointer-events: none 让鼠标能"穿过"UI 点到游戏；
       子元素里需要点的部分再单独打开 */
    #ui { position: absolute; inset: 0; pointer-events: none; }
    #ui > * { pointer-events: auto; }

    /* ===== 状态栏（左上角） ===== */
    #status {
      position: absolute; top: 10px; left: 10px;
      width: 250px; padding: 10px 12px;
      background: rgba(20, 20, 20, .78);
      border: 2px solid #c9a227; border-radius: 6px;
      color: #eee; font-family: sans-serif; font-size: 14px;
    }
    #status .title { color: #c9a227; font-weight: bold; font-size: 16px; }
    .stat-row { margin-top: 4px; }
    .bar {
      height: 12px; background: #333;
      border-radius: 6px; overflow: hidden; margin-top: 2px;
    }
    .bar-fill { height: 100%; width: 100%; transition: width .15s; }
    #hp-fill { background: #c0392b; }  /* 红色气血条 */
    #qi-fill { background: #2980b9; }  /* 蓝色内力条 */

    /* ===== 物品栏（底部中间，5 格，按 1~5 使用） ===== */
    #hotbar {
      position: absolute; bottom: 12px; left: 50%;
      transform: translateX(-50%);
      display: flex; gap: 6px;
    }
    .hotbar-slot {
      width: 76px; height: 62px; padding: 4px; box-sizing: border-box;
      background: rgba(20, 20, 20, .78);
      border: 2px solid #c9a227; border-radius: 6px;
      color: #eee; font-size: 12px; font-family: sans-serif;
      text-align: center; cursor: pointer; line-height: 1.4;
    }
    .hotbar-slot .key { color: #c9a227; font-weight: bold; }

    /* ===== 技能栏（右下角，Q/E/R 施放） ===== */
    #skills {
      position: absolute; bottom: 12px; right: 12px;
      display: flex; gap: 6px;
    }
    .skill-slot {
      width: 100px; padding: 6px 8px; box-sizing: border-box;
      background: rgba(20, 20, 20, .78);
      border: 2px solid #c9a227; border-radius: 6px;
      color: #eee; font-size: 12px; font-family: sans-serif;
      text-align: center; cursor: pointer;
    }
    .skill-slot.not-ready { opacity: .45; border-color: #666; }
    .skill-slot .key { color: #c9a227; font-weight: bold; margin-right: 2px; }
    .skill-info { color: #999; }

    /* ===== 操作提示（左下角） ===== */
    #hint {
      position: absolute; bottom: 12px; left: 12px;
      color: #9a9a9a; font-size: 12px; font-family: sans-serif;
      background: rgba(20, 20, 20, .55); padding: 4px 10px;
      border-radius: 4px; white-space: nowrap;
    }

    /* ===== 提示条（物品栏上方） ===== */
    #toast {
      position: absolute; bottom: 90px; left: 50%; transform: translateX(-50%);
      background: rgba(20, 20, 20, .85); border: 1px solid #c9a227;
      border-radius: 4px; padding: 6px 14px;
      color: #ffe066; font-size: 14px; font-family: sans-serif;
      white-space: nowrap;
    }

    /* ===== 背包（按 B 开关，屏幕中间） ===== */
    #inventory {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 640px; height: 380px; padding: 14px; box-sizing: border-box;
      background: rgba(15, 15, 15, .93);
      border: 2px solid #c9a227; border-radius: 8px;
      color: #eee; font-family: sans-serif;
      display: none; /* 默认隐藏，按 B 加上 .open 类显示 */
    }
    #inventory.open { display: block; }
    #inv-title { color: #c9a227; font-size: 18px; margin-bottom: 10px; }
    #inv-body { display: flex; gap: 16px; height: 300px; }

    /* 装备栏（左，8 个部位排成两列） */
    #equip-slots {
      width: 260px;
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
      align-content: start; overflow-y: auto;
    }
    .equip-slot {
      border: 1px solid #666; border-radius: 6px; padding: 6px 10px;
      min-height: 40px;
    }
    .equip-slot.empty { color: #777; }
    .equip-label { color: #c9a227; font-size: 12px; margin-bottom: 2px; }

    /* 物品列表（右） */
    #item-list {
      flex: 1; overflow-y: auto;
      display: flex; flex-direction: column; gap: 6px;
    }
    .inv-row {
      display: flex; gap: 10px; align-items: center;
      background: rgba(255, 255, 255, .06); border-radius: 4px;
      padding: 6px 10px; cursor: pointer;
    }
    .inv-row:hover { background: rgba(255, 255, 255, .14); }
    .inv-name { width: 190px; color: #fff; }
    .inv-desc { flex: 1; color: #999; font-size: 12px; }
    .inv-action { color: #c9a227; font-size: 12px; }
  </style>
</head>
<body>
  <div id="app">
    <div id="game-wrap">
      <div id="game"></div>  <!-- Phaser 画布会被放到这里 -->

      <div id="ui">
        <!-- 状态栏 -->
        <div id="status">
          <span class="title" id="name">无名散修</span>
          <span class="title">· <span id="phase">炼精化气</span> · <span id="realm">练气一层</span></span>
          <div class="stat-row">气血 <span id="hp-text"></span></div>
          <div class="bar"><div class="bar-fill" id="hp-fill"></div></div>
          <div class="stat-row">内力 <span id="qi-text"></span></div>
          <div class="bar"><div class="bar-fill" id="qi-fill"></div></div>
          <div class="stat-row">护甲 <span id="armor">0</span> · 攻击 <span id="attack">0</span></div>
          <div class="stat-row">经验 <span id="exp">0/100</span></div>
          <div class="stat-row">灵根 <span id="linggen">—</span></div>
          <div class="stat-row">悟性 <span id="wuxing">—</span> · 根骨 <span id="gengu">—</span> · 福缘 <span id="fuyuan">—</span></div>
        </div>

        <!-- 提示条 -->
        <div id="toast"></div>

        <!-- 物品栏（5 格，由 ui.js 填充） -->
        <div id="hotbar"></div>

        <!-- 技能栏（Q/E/R 施放，内容由 ui.js 渲染） -->
        <div id="skills">
          <div class="skill-slot" data-index="0"></div>
          <div class="skill-slot" data-index="1"></div>
          <div class="skill-slot" data-index="2"></div>
        </div>

        <!-- 操作提示 -->
        <div id="hint">左键：攻击（按住连击） · WASD/方向键：移动 · B：背包</div>

        <!-- 背包（按 B 开关，内容由 ui.js 渲染） -->
        <div id="inventory">
          <div id="inv-title">背包（按 B 关闭 · 点击物品使用/装备/卸下）</div>
          <div id="inv-body">
            <div id="equip-slots"></div>
            <div id="item-list"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
